<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="ui.css"><title>签到确认</title></head><body><main><div class="topbar"><div><h1 id="title">签到确认</h1><p id="subtitle">核对课程、班次和来源后再提交。</p></div><button class="secondary" id="rescan">重新查找</button></div><section id="results"></section><section class="card confirm"><label class="row"><span>我确认：我实际参加了上面勾选的课程，并授权现在向 Monash Attendance 提交这些记录。</span><input type="checkbox" id="attended"></label><p class="danger-note">点击提交会写入正式考勤记录；如果代码或班次不确定，请先取消勾选。</p><button class="primary" id="submit" disabled>确认并提交所选记录</button><p id="submitStatus"></p></section><section class="card" id="scanLog" hidden><h2>本次扫描过的页面</h2><p class="muted">没找到代码时先看这里：页面是否打开成功、是否要求重新登录。</p><ul id="scanList"></ul></section><section class="card" id="debugLog"><h2>调试日志</h2><p class="muted">最终核对没有跑完时，这里能看到后台每一步的记录，不用打开开发者工具。<button class="secondary" id="clearDebugLog" type="button">清空日志</button></p><pre id="debugLogText" class="excerpt"></pre></section></main><script type="module" src="review.js"></script></body></html>
