<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="ui.css">
  <title>Attendance Helper 设置</title>
</head>
<body>
  <main>
    <div class="topbar">
      <div><h1>自动查码设置</h1><p>添加你自己的课程、班次和提醒时间；设置只保存在这台电脑。</p></div>
      <span class="badge">本地运行</span>
    </div>

    <section class="card stack">
      <h2>学期与提醒</h2>
      <p class="muted">默认直接从 Attendance 识别最近 7 天的课程，不要求你另填课表；Week 1 和手动课程只用于备用模式。</p>
      <label class="inline-label"><strong>自动从 Attendance 识别课程</strong> <input type="checkbox" id="autoDiscover"></label>
      <div class="course-grid">
        <label>Week 1 的星期一</label><input type="date" id="weekOneMonday">
        <label>设备时区（自动）</label><input type="text" id="timezone" readonly>
      </div>
      <div class="reminder-settings">
        <div>
          <strong>主提醒</strong>
          <div class="session compact">
            <select id="primaryDay" aria-label="主提醒星期"><option value="0">周日</option><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option></select>
            <input type="time" id="primaryTime" aria-label="主提醒时间">
          </div>
        </div>
        <div>
          <label class="inline-label"><strong>备用提醒</strong> <input type="checkbox" id="backupEnabled"></label>
          <div class="session compact">
            <select id="backupDay" aria-label="备用提醒星期"><option value="0">周日</option><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option></select>
            <input type="time" id="backupTime" aria-label="备用提醒时间">
          </div>
        </div>
      </div>
    </section>

    <div class="section-title-row">
      <div><h2>手动课程（可选）</h2><p>仅在关闭 Attendance 自动识别时使用。</p></div>
      <button class="secondary" id="addCourse">＋ 添加课程</button>
    </div>
    <section id="courses"></section>

    <div class="actions">
      <button class="primary" id="save">保存并启用</button>
      <button class="secondary" id="scan">保存后立即测试</button>
      <button class="secondary" id="import">导入网页配置</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <p id="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
