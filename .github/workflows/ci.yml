name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Test extension parser
        run: node --test tests/*.test.mjs

      - name: Build store package and scan for remote code
        run: bash scripts/build-store-zip.sh

      - name: Upload Chrome extension package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: store/monash-attendance-helper-*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build and test site
        working-directory: site
        run: npm test

      - name: Lint site
        working-directory: site
        run: npm run lint
